<svg xmlns="http://www.w3.org/2000/svg" width="150" height="36" viewBox="0 0 150 36">
  <title>ALT Web</title>
  <style>
    :root { --ink: #11151e; --signal: #1544c8; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f6f7fb; --signal: #8babff; }
    }
    .name { fill: var(--ink); }
    .signal { fill: var(--signal); }
    .travel, .tip, .insert {
      animation-duration: 6.8s;
      animation-timing-function: cubic-bezier(.4, 0, .18, 1);
      animation-iteration-count: infinite;
    }
    .travel { animation-name: slide; }
    .tip { animation-name: lift; }
    .insert { animation-name: release; }
    @keyframes slide {
      0%, 15%, 88%, 100% { transform: translateX(0); }
      37%, 69% { transform: translateX(23px); }
    }
    @keyframes lift {
      0%, 17%, 78%, 100% { transform: translateY(0); }
      35%, 61% { transform: translateY(-16px); }
    }
    @keyframes release {
      0%, 60%, 100% { transform: translateY(0); }
      72%, 91% { transform: translateY(23px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .travel, .tip, .insert { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="insertion"><path d="M51 5h30v23H51z"/></clipPath>
  </defs>
  <!-- Stationary ALT. Every letter uses the same cap line and baseline. -->
  <path class="name" fill-rule="evenodd" d="M0 28 8 8h6l8 20h-5.6l-1.5-4H7.1l-1.5 4zm8.8-8h4.6L11.1 13z M23 8h5v15.5h10V28H23z M35 8h20v4.5h-7.5V28h-5V12.5H35z"/>
  <g class="signal">
    <!-- Only the inserted lowercase letters pass through this aperture. -->
    <g clip-path="url(#insertion)">
      <g class="travel">
        <g class="insert">
          <path fill-rule="evenodd" d="M30.3 16.1c2-1.4 4.5-2.1 7.4-2.1 4.8 0 7.1 2.1 7.1 6.2V28h-4.5v-1.5c-1.2 1.2-2.8 1.8-4.8 1.8-3.3 0-5.5-1.8-5.5-4.6 0-3.1 2.3-4.8 6.5-4.8h3.7c-.2-1.2-1.2-1.8-3-1.8-1.7 0-3.2.5-4.7 1.4zm10 5.6h-3.4c-1.5 0-2.2.6-2.2 1.6 0 .9.7 1.5 2 1.5 1.8 0 3.2-1 3.6-2.6z"/>
        </g>
        <g class="tip"><path d="M49.7 30h4.6v14h-4.6z"/></g>
      </g>
    </g>
    <g class="travel">
      <g class="tip"><circle cx="52" cy="25.6" r="2.4"/></g>
      <!-- WEB moves as one unit, preserving its internal letter spacing. -->
      <path fill-rule="evenodd" d="M57 8h5.3l3.2 13.4L69.4 8h4.4l3.9 13.4L81 8h5.2l-5.8 20h-5l-3.8-12.9L67.7 28h-5z M88 8h16v4.3H93v3.5h9.6v4.1H93v3.8h11.3V28H88z M107 8h10.4c4.4 0 7 2 7 5.4 0 1.9-.9 3.4-2.8 4.3 2.3.8 3.6 2.4 3.6 4.6 0 3.6-2.8 5.7-7.4 5.7H107zm5 4v4h4.7c1.7 0 2.7-.7 2.7-2s-1-2-2.7-2zm0 7.9v4.2h5.2c1.8 0 2.8-.7 2.8-2.1s-1-2.1-2.8-2.1z"/>
    </g>
  </g>
</svg>
